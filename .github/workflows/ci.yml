name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install BetterLeaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz -o "$archive"
          echo 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a  '"$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" betterleaks
      - name: Build and scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          for os in windows linux darwin; do
            for arch in amd64 arm64; do
              dir="$RUNNER_TEMP/build-$os-$arch"
              mkdir -p "$dir"
              binary=ocs-ai-answerer
              if [ "$os" = windows ]; then binary="$binary.exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$dir/$binary" .
              "$RUNNER_TEMP/betterleaks" dir --redact --regex-engine stdlib --no-banner .
              if [ "$os" = windows ]; then
                (cd "$dir" && zip -q "$RUNNER_TEMP/release/ocs-ai-answerer-$os-$arch.zip" "$binary")
              else
                tar -C "$dir" -czf "$RUNNER_TEMP/release/ocs-ai-answerer-$os-$arch.tar.gz" "$binary"
              fi
            done
          done
          (cd "$RUNNER_TEMP/release" && sha256sum * > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
